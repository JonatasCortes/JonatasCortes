<svg xmlns="http://www.w3.org/2000/svg" width="510" height="348" viewBox="0 0 510 348" role="img" aria-labelledby="title desc" >
  <title id="title">HNSW Character Recognition</title>
  <desc id="desc">Train and test your own HNSW model in pure Python on the Balanced EMNIST dataset, with detailed metrics and a 47-class confusion matrix. The animation shows the app: drawing a character, classifying it and viewing the results.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF0055"/>
      <stop offset="1" stop-color="#7000FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#FF0055" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF0055" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="1.5" y="1.5" width="507" height="345" rx="15"/></clipPath>
    <clipPath id="win"><rect x="520" y="31.1" width="358" height="285.8" rx="11"/></clipPath>
  </defs>
  <rect x="1.5" y="1.5" width="507" height="345" rx="15" fill="#080811"/>
  <g clip-path="url(#card)">
    <ellipse cx="400" cy="174" rx="300" ry="261" fill="url(#glow)"/>
    <path d="M392.0 2.0Q401.8 12.2 415.3 16.1M415.3 16.1Q426.0 27.7 441.3 31.1M441.3 31.1Q452.2 23.1 456.4 10.3M456.4 10.3Q470.3 16.4 484.8 21.3M456.4 10.3Q460.4 19.9 467.9 27.1M440.0 2.0Q443.6 16.4 441.3 31.1M467.9 27.1Q482.3 16.8 492.0 2.0" stroke="#FF0055" stroke-width="1.3" fill="none" opacity=".55"/>
    <g fill="#121324" stroke="#FF0055" stroke-width="1.8"><circle cx="392.0" cy="2.0" r="7.5"/><circle cx="415.3" cy="16.1" r="6.2"/><circle cx="441.3" cy="31.1" r="5.4"/><circle cx="456.4" cy="10.3" r="4.6"/><circle cx="440.0" cy="2.0" r="7.5"/><circle cx="492.0" cy="2.0" r="7.5"/></g>
    <g fill="#00F0FF"><circle cx="484.8" cy="21.3" r="2.3"/><circle cx="467.9" cy="27.1" r="2.3"/><circle cx="392.0" cy="2.0" r="2.8"/><circle cx="415.3" cy="16.1" r="2.8"/><circle cx="441.3" cy="31.1" r="2.8"/></g>
    
  </g>
  <rect x="1.5" y="1.5" width="507" height="345" rx="15" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <rect x="22" y="22" width="4" height="22" rx="2" fill="#FF0055"/>
  <text x="37" y="39" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#FF0055">HNSW CHARACTER RECOGNITION</text>

  <rect x="10" y="62" width="4" height="106" rx="2" fill="#FF0055" opacity="0"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#FFFFFF">
    <text x="22" y="84">Build, train and test your own <tspan fill="#FF0055" font-weight="700">HNSW (Hierarchical</tspan></text>
    <text x="22" y="110"><tspan fill="#FF0055" font-weight="700">Navigable Small World)</tspan> model in <tspan fill="#FF0055" font-weight="700">pure Python</tspan>, with no ML</text>
    <text x="22" y="136">libraries, on the <tspan fill="#FF0055" font-weight="700">Balanced EMNIST</tspan> dataset of handwritten</text>
    <text x="22" y="162">characters.</text>
    <text x="22" y="204">Explore detailed performance metrics: correct and incorrect</text>
    <text x="22" y="230">classifications, <tspan fill="#FF0055" font-weight="700">accuracy</tspan>, total testing time and a complete</text>
    <text x="22" y="256"><tspan fill="#FF0055" font-weight="700">47-class confusion matrix</tspan>.</text>
  </g>

  <rect x="22" y="282" width="463" height="36" rx="18.0" fill="#FF0055" fill-opacity=".08" stroke="#FF0055" stroke-width="1.5"/>
  <text x="42" y="305" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#FFFFFF">Check out the <tspan fill="#FF0055" font-weight="700">GitHub repository</tspan> and run the project yourself!</text>
  <path d="M452 300.0H466M461 295.0L466 300.0L461 305.0" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
