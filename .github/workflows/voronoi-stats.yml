name: voronoi-stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voronoi-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: JonatasCortes/voronoi-stats@v1
        with:
          theme: neon
          token: ${{ secrets.GH_TOKEN }}
          idle_animation: orbit,glint,scan,trace